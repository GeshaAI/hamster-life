<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#f8e8c9"><title>HAMSTER LIFE — Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8e8c9;color:#473421;font:16px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:12px}h1{text-align:center;font-size:26px;margin:8px}small{color:#765e49}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.stat{background:#fff7e8;border-radius:12px;padding:8px;text-align:center;font-size:13px}.bar{height:8px;background:#e3d3bd;border-radius:8px;overflow:hidden;margin-top:5px}.fill{height:100%;background:#8fb76d;width:50%}.cage{position:relative;height:min(65vw,390px);min-height:260px;border:9px solid #b18b5c;border-radius:22px;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0 28px,#ffffff77 29px 32px),linear-gradient(#d3edf0 0 73%,#e9d3a4 73%);touch-action:manipulation}.cage:after{content:"";position:absolute;bottom:0;height:20px;background:#c7a56c;width:100%}.thing{position:absolute;bottom:26px;text-align:center;font-size:42px;z-index:2}.food{left:6%}.water{right:7%}.bed{left:40%;bottom:16px;font-size:52px}.hamster{position:absolute;left:50%;top:57%;font-size:76px;transform:translate(-50%,-50%);transition:left 1.2s linear,top 1.2s linear;z-index:3;filter:drop-shadow(0 7px 4px #7d593d55)}.bubble{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fffaf1;border-radius:18px;padding:7px 12px;white-space:nowrap;z-index:4;font-size:14px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}button{border:0;border-radius:13px;background:#a56d3e;color:white;padding:15px 8px;font-size:16px;font-weight:700;cursor:pointer}button:active{transform:scale(.98)}.info{text-align:center;background:#fff7e8;border-radius:12px;padding:10px}.note{font-size:12px;text-align:center;margin-top:8px}</style></head>
<body><main><h1>🐹 HAMSTER LIFE <small>DEMO</small></h1><div class="stats">
<div class="stat">🍎 Сытость<div class="bar"><div class="fill" id="hunger"></div></div></div>
<div class="stat">💧 Вода<div class="bar"><div class="fill" id="thirst"></div></div></div>
<div class="stat">⚡ Энергия<div class="bar"><div class="fill" id="energy"></div></div></div>
</div><div class="cage" id="cage"><div class="bubble" id="mood">Изучаю клетку 🐾</div><div class="thing food">🥣</div><div class="thing water">🚰</div><div class="thing bed">🛖</div><div class="hamster" id="hamster">🐹</div></div>
<div class="stats"><div class="stat">🌻 Корм: <b id="food">70</b></div><div class="stat">💦 Запас воды: <b id="water">70</b></div><div class="stat">🕒 Возраст: <b id="age">0</b> мин.</div></div>
<div class="buttons"><button id="feed">🌻 Насыпать корм</button><button id="fill">💧 Налить воду</button><button id="play">🎾 Поиграть</button><button id="sleep">🌙 Уложить спать</button></div>
<div class="info" id="status">Хомячок живёт своей жизнью!</div><div class="note">Бесплатная офлайн-демоверсия после первой загрузки не требует сервера для симуляции. Данные хранятся в браузере этого устройства.</div></main>
<script>
(()=>{'use strict';const key='hamster-life-web-v1',defaults={hunger:80,thirst:80,energy:80,food:70,water:70,age:0,x:50,y:57,action:'Гуляю по клетке',saved:Date.now()};let s;try{s=Object.assign({},defaults,JSON.parse(localStorage.getItem(key)||'{}'))}catch(e){s={...defaults}}let elapsed=Math.min(86400,Math.max(0,(Date.now()-Number(s.saved||Date.now()))/1000));s.hunger=Math.max(0,s.hunger-elapsed*.012);s.thirst=Math.max(0,s.thirst-elapsed*.017);s.energy=Math.max(0,s.energy-elapsed*.005);s.age+=elapsed/60;let sleeping=false,playing=0;const $=id=>document.getElementById(id),clamp=n=>Math.max(0,Math.min(100,n));function save(){s.saved=Date.now();try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}function render(){for(const [id,v] of [['hunger',s.hunger],['thirst',s.thirst],['energy',s.energy]]){$(id).style.width=clamp(v)+'%';$(id).style.background=v<25?'#e27b61':'#8fb76d'}for(const id of ['food','water'])$(id).textContent=Math.floor(s[id]);$('age').textContent=Math.floor(s.age);$('hamster').style.left=s.x+'%';$('hamster').style.top=s.y+'%';$('mood').textContent=s.action;$('status').textContent=s.hunger<15?'Хомячок голоден!':s.thirst<15?'Хомячок хочет пить!':s.energy<15?'Хомячок устал!':'Хомячок чувствует себя нормально ❤️'}function move(x,y,msg){s.x=x;s.y=y;s.action=msg}function tick(){s.age+=1/60;s.hunger=clamp(s.hunger-.06);s.thirst=clamp(s.thirst-.08);if(sleeping){s.energy=clamp(s.energy+1.6);move(49,63,'Сплю... 💤');if(s.energy>=95)sleeping=false}else{s.energy=clamp(s.energy-.045);if(s.thirst<65&&s.water>0){move(86,55,'Пью воду 💧');let n=Math.min(s.water,.6);s.water-=n;s.thirst=clamp(s.thirst+n*1.8)}else if(s.hunger<65&&s.food>0){move(14,55,'Кушаю 🌻');let n=Math.min(s.food,.6);s.food-=n;s.hunger=clamp(s.hunger+n*1.8)}else if(s.energy<20){sleeping=true}else if(playing>0){playing--;move(25+Math.random()*50,40+Math.random()*24,'Играю! 🎾')}else{move(15+Math.random()*70,40+Math.random()*27,'Исследую клетку 🐾')}}render();save()}$('feed').onclick=()=>{s.food=clamp(s.food+30);s.action='Спасибо за корм! 🌻';render();save()};$('fill').onclick=()=>{s.water=clamp(s.water+30);s.action='Свежая вода! 💧';render();save()};$('play').onclick=()=>{playing=12;sleeping=false;s.energy=clamp(s.energy-5);tick()};$('sleep').onclick=()=>{sleeping=true;tick()};render();setInterval(tick,2000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('pagehide',save)})();
</script></body></html>
